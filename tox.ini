[tox]
envlist = lint,typecheck,py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run linting with ruff
deps =
    ruff>=0.14.0
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
description = Run type checking with ty
deps =
    ty>=0.0.8
commands =
    ty check .

[testenv:fix]
description = Auto-fix linting issues with ruff
deps =
    ruff>=0.14.0
commands =
    ruff check --fix .
    ruff format .
