[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ih"
version = "0.1.0"
description = "IH Ingestion Module"
requires-python = ">=3.14.2"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "examples*", "loadcore*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ty>=0.0.8",
    "ruff>=0.14.0",
    "pre-commit>=3.5.0",
    "tox>=4.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

# Include directories and files
include = ["pyproject.toml", "*.py"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "**/tests/"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D212",
    "D203",
    "D211",
    "COM812",
    "ISC001",
    "ERA001",
    "Q000",
    "Q001",
    "EXE002",
    "TD002",
    "TD003",
    "FIX002",
    "D104",
    "RET505",
    "S506",
    "PTH120",
    "T201",
    "N812",
    "PLR2004", # Allow magic numbers
    "C901", # Allow complex functions
    "PLR0912", # Allow too many branches
    "PLR0915", # Allow too many statements
    "RUF005",
    "G004", # Allow use of logging-f-string
    "ARG002", # Allow unused method arguments (API extensibility)
    "RUF012", # Allow mutable class attributes without ClassVar
    "N801", # Allow lowercase class names for decorator classes
    "PLW1641", # Allow Mapping without __hash__ (ProcessingResult)
    "TC002", # Allow runtime imports (needed for DataFrame operations)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty]

[tool.ty.environment]
python-version = "3.14"
python = "/usr/local/bin/python"

[tool.ty.src]
include = ["src", "loadcore", "pipelines", "custom_logger"]
exclude = ["tests", "**/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
