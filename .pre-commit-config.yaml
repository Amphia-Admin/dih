repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ty type checker (local hook as official pre-commit hook pending)
  # https://github.com/astral-sh/ty/issues/269
  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: python -m ty check
        language: system
        types: [python]
        pass_filenames: false
        args: [--error-on-warning]
